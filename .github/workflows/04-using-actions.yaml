name: 04 - Using Actions
on: push

jobs:
     build:
        runs-on: ubuntu-latest
        defaults:
              run: 
                  working-directory: react-app  
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            #- name: Printing Folders
            #  run:  ll 
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                 node-version: '20.x'
            - name: Install dependencies
              run: npm ci
            - name: run unit test
              run: npm run test    


            
